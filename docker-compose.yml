services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # No host port published - Caddy on the host (a separate, already-
    # running compose project) reverse-proxies to this container directly
    # over the shared `plantpal_proxy` external network (see bottom of this
    # file) and terminates TLS there. See the generated Caddyfile for the
    # matching `reverse_proxy api:8133` site block.
    expose:
      - "8133"
    env_file:
      - .env
    environment:
      PORT: 8133
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-plantpal}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      REMINDER_INTERVAL: ${REMINDER_INTERVAL:-1m}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8133/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - default
      - plantpal_proxy

  # Optional local Mongo, unused when MONGO_URI in .env points at an Atlas cluster.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:

# Shared with the ifingi-web-cloude compose project's `caddy` service, so
# Caddy can reach this project's `api` container by service name even
# though they're two separate compose projects (each gets its own isolated
# default network otherwise). Create once on the VPS before first deploy:
#   docker network create plantpal_proxy
networks:
  plantpal_proxy:
    external: true