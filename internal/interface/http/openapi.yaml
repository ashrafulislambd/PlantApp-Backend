openapi: 3.0.3
info:
  title: PlantPal API
  description: >
    API for the PlantPal app: plant care roadmaps, AI Doctor diagnosis,
    homemade fertilizer recipes, and the AI chat assistant. Repositories are
    currently in-memory and reset on restart.


    Localization: send an `Accept-Language: bn` header to receive Bengali
    text for fertilizer recipes, diagnosis results, and plant care
    tips/fertilizer recommendations, where a translation exists. Any other
    value (or no header) returns English. This only affects
    server-generated/seeded text, not user-submitted content (e.g. a
    fertilizer a user adds themselves).


    Time zone: clients may send `X-UTC-Offset-Minutes` (e.g. `360` for UTC+6)
    or `X-Timezone` (IANA name, e.g. `Asia/Dhaka`; wins when both are sent).
    It is used where a clock time must mean the user's local time, such as the
    roadmap watering times when a plant has no watering interval. Without it
    the server uses UTC. Push devices (`POST /api/v1/devices`) may also send
    `timezone` and/or `utcOffsetMinutes`; reminders are not pushed to a device
    between 22:00 and 07:00 local time and are sent after that instead.
  version: "1.0.0"
servers:
  - url: /
tags:
  - name: Plants
  - name: Fertilizers
  - name: Diagnoses
  - name: Chat
  - name: Meta

paths:
  /health:
    get:
      tags: [Meta]
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /api/v1/health:
    get:
      tags: [Meta]
      summary: API v1 liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: v1

  /api/v1/plants:
    get:
      tags: [Plants]
      summary: List all registered plants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plant"
    post:
      tags: [Plants]
      summary: Register a plant and generate its care roadmap
      description: Backs the "Create My Roadmap" action on the Maintainance screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlantRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/plants/{id}:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      tags: [Plants]
      summary: Get a plant by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Plants]
      summary: Delete a plant
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Plants]
      summary: Edit a plant
      description: |
        Only the fields that are sent change. The care roadmap and fertilizing
        schedule are regenerated only when `type` or `ageStage` actually
        changed. Changing `wateringFrequencyDays` re-anchors the next watering
        on `lastWateredAt` (never on "now"); a plant that was never watered
        keeps its due date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlantRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plants/{id}/water:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      tags: [Plants]
      summary: Log a watering now
      description: |
        Sets `lastWateredAt` to now and `nextWateringAt` to now +
        `wateringFrequencyDays`. The roadmap clock times are only used when the
        interval is 0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [plant, pointsEarned]
                    properties:
                      plant:
                        $ref: "#/components/schemas/Plant"
                      pointsEarned:
                        type: integer
                        description: Points awarded by the server for a due watering; zero otherwise.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plants/{id}/fertilize:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      tags: [Plants]
      summary: Log a fertilizing now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [plant, pointsEarned]
                    properties:
                      plant:
                        $ref: "#/components/schemas/Plant"
                      pointsEarned:
                        type: integer
                        description: Points awarded by the server for due fertilizing; zero otherwise.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plants/{id}/skip:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      tags: [Plants]
      summary: Skip or snooze a watering reminder
      description: Reschedules the next watering without changing lastWateredAt or penalizing health.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [soil_still_wet, rained, other]
                days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 1
      responses:
        "200":
          description: Updated plant schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plants/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      tags: [Plants]
      summary: Add a note to plant history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Note recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/plants/events:
    get:
      tags: [Plants]
      summary: List the signed-in user's garden events
      responses:
        "200":
          description: Newest-first event feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlantEvent"

  /api/v1/plants/{id}/events:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      tags: [Plants]
      summary: List events for one plant
      responses:
        "200":
          description: Newest-first event feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlantEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/fertilizers:
    get:
      tags: [Fertilizers]
      summary: List/search fertilizer recipes
      description: Backs the "Find your homemade fertilizer" search bar.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name or category.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Fertilizer"
    post:
      tags: [Fertilizers]
      summary: Add a new fertilizer recipe
      description: Backs the "Add a new Fertilizer" button.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFertilizerRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fertilizer"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/fertilizers/{id}:
    parameters:
      - $ref: "#/components/parameters/FertilizerId"
    get:
      tags: [Fertilizers]
      summary: Get a fertilizer recipe by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fertilizer"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/diagnoses:
    get:
      tags: [Diagnoses]
      summary: List diagnosis log entries
      description: Backs the "Add to Log" history on the Diseases Detection screen.
      parameters:
        - name: plantId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Diagnosis"
    post:
      tags: [Diagnoses]
      summary: Submit a plant photo for AI diagnosis
      description: >
        Backs "Upload your Plant's Photo" / "Open Camera to take photo" on
        the Diseases Detection screen. Currently served by a mock provider
        that rotates through canned results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiagnosisRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Diagnosis"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/diagnoses/{id}:
    parameters:
      - $ref: "#/components/parameters/DiagnosisId"
    get:
      tags: [Diagnoses]
      summary: Get a diagnosis by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Diagnosis"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/diagnoses/{id}/treated:
    parameters:
      - $ref: "#/components/parameters/DiagnosisId"
    post:
      tags: [Diagnoses]
      summary: Mark a diagnosis as treated
      description: >
        The user acted on the advice. Idempotent: marking again keeps the
        first `treatedAt`. No request body.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Diagnosis"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/messages:
    get:
      tags: [Chat]
      summary: List a chat session's message history
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Chat]
      summary: Send a message and get an assistant reply
      description: Backs the "AI Chat Box" composer. Returns both the user's stored message and the generated assistant reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/chat/messages/stream:
    post:
      tags: [Chat]
      summary: Send a message and stream the assistant reply (Server-Sent Events)
      description: |
        Same contract as `POST /chat/messages`, but the reply is delivered as
        `text/event-stream` while it is generated. Events, in order:

        - `start` — `{"userMessage": ChatMessage, "assistantId": "msg_..."}`
        - `delta` — `{"text": "..."}` (repeated; append to the reply)
        - `done` — `{"message": ChatMessage}` (the stored, complete reply)
        - `error` — `{"code": "rate_limited|interrupted|canceled", "error": "...", "message": ChatMessage?}`;
          `message` is the partial reply, which is stored.

        Failures before the first `delta` (validation, rate limit, all
        providers down) are ordinary JSON errors with a real status code.
        Closing the connection stops generation; the partial reply is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: AI provider rate limit reached (Retry-After header set)

  /api/v1/chat/sessions:
    get:
      tags: [Chat]
      summary: List the user's chat sessions, most recent first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatSession"

  /api/v1/chat/sessions/{id}:
    delete:
      tags: [Chat]
      summary: Delete a chat session and all of its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PlantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FertilizerId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DiagnosisId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "invalid input: name is required"

    CareRoadmap:
      type: object
      properties:
        wateringTimes:
          type: array
          items:
            type: string
          example: ["08:00", "18:00"]
        waterAmountMl:
          type: integer
          example: 200
        tips:
          type: string
        fertilizerRecommendation:
          type: string

    Plant:
      type: object
      properties:
        id:
          type: string
          example: pl_3f9a1c2b4e5d6f7a8b9c0d1e
        name:
          type: string
          example: Rose
        type:
          type: string
          example: Water based
        ageStage:
          type: string
          example: mature
        location:
          type: string
        sunlight:
          type: string
        outdoor:
          type: boolean
          description: True for a plant that lives outside (garden, balcony). Default false (indoor).
        wateringFrequencyDays:
          type: integer
          description: The user's watering interval. Drives the schedule.
          example: 5
        image:
          type: string
          description: Relative URL of the plant photo.
        careRoadmap:
          $ref: "#/components/schemas/CareRoadmap"
        lastWateredAt:
          type: string
          format: date-time
          description: Absent if the plant was never watered.
        nextWateringAt:
          type: string
          format: date-time
        lastFertilizedAt:
          type: string
          format: date-time
        nextFertilizingAt:
          type: string
          format: date-time
        health:
          type: integer
          minimum: 10
          maximum: 100
          description: |
            Computed on every read, never stored. `100 - penalties`, clamped
            to 10..100. Watering overdue: 1 day grace, then -12 per further
            day (cap -70). Fertilizing overdue: 3 days grace, then -5 per
            started week (cap -15). Latest scan: Mild -10, Moderate -25,
            Severe -45; full for 7 days, half for days 8-14, none afterwards.
          example: 76
        healthState:
          type: string
          enum: [thriving, okay, needs_care, critical]
          description: thriving >= 85, okay 65-84, needs_care 40-64, critical < 40.
        healthReasons:
          type: array
          description: Why the score is below 100. Empty when nothing is wrong.
          items:
            $ref: "#/components/schemas/HealthReason"
        lastScan:
          $ref: "#/components/schemas/PlantLastScan"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantEvent:
      type: object
      required: [id, plantId, userId, eventType, points, createdAt]
      properties:
        id:
          type: string
        plantId:
          type: string
        userId:
          type: string
        eventType:
          type: string
          enum: [water, fertilize, scan, skip, note]
        reason:
          type: string
        note:
          type: string
        points:
          type: integer
        imageUrl:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    HealthReason:
      type: object
      required: [code, impact]
      description: The client localises `code`; the server sends no display text.
      properties:
        code:
          type: string
          enum: [water_late, fertilizer_late, scan_issue]
        value:
          type: integer
          description: Whole days late (water_late, fertilizer_late).
          example: 3
        detail:
          type: string
          description: The scan issue text (scan_issue). English only for now.
        severity:
          type: string
          enum: [mild, moderate, severe]
          description: Scan severity (scan_issue).
        impact:
          type: integer
          description: Points taken off the score (a negative number).
          example: -24

    PlantLastScan:
      type: object
      nullable: true
      description: The most recent AI Doctor scan saved against this plant. Absent if none.
      properties:
        issue:
          type: string
        id:
          type: string
          description: The diagnosis id (use it with `POST /diagnoses/{id}/treated`).
        severity:
          type: string
          description: Mild, Moderate, Severe, or none.
        treated:
          type: boolean
          description: The user marked the scan as treated; it no longer lowers health.
        at:
          type: string
          format: date-time

    CreatePlantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Rose
        type:
          type: string
          example: Water based
        ageStage:
          type: string
          description: Free text; seed/seedling, young and mature/adult are the known stages.
          example: mature
        location:
          type: string
        sunlight:
          type: string
        outdoor:
          type: boolean
          description: Optional. True for a plant that lives outside. Default false.
        wateringFrequencyDays:
          type: integer
          example: 5
        waterAmountMl:
          type: integer
          description: Optional (max 5000). Replaces the generated `careRoadmap.waterAmountMl`, e.g. the value from AI identify.
          example: 250
        careTips:
          type: string
          maxLength: 1000
          description: Optional. Replaces the generated `careRoadmap.tips`.
        lastWateredAt:
          type: string
          format: date-time
          description: |
            When the plant was last watered. If sent, `nextWateringAt` is
            `lastWateredAt + wateringFrequencyDays`. If omitted, the plant is
            treated as not watered and is due right now.

    UpdatePlantRequest:
      type: object
      description: All fields optional; only the ones sent change.
      properties:
        name:
          type: string
        type:
          type: string
        ageStage:
          type: string
        location:
          type: string
        sunlight:
          type: string
        outdoor:
          type: boolean
          description: Optional. Omit to keep the current value.
        wateringFrequencyDays:
          type: integer

    Fertilizer:
      type: object
      properties:
        id:
          type: string
          example: fert_seed_nitrogen
        name:
          type: string
          example: Nitrogen (leaf growth)
        category:
          type: string
          example: Nitrogen
        instructions:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateFertilizerRequest:
      type: object
      required: [name, instructions]
      properties:
        name:
          type: string
        category:
          type: string
        instructions:
          type: string

    Diagnosis:
      type: object
      properties:
        id:
          type: string
          example: diag_2360faf5c84fc7fed73a6b5f
        plantId:
          type: string
          nullable: true
        issue:
          type: string
          example: Your plant is suffering from Phosphorus deficiency.
        cure:
          type: string
          example: Use Triple Superphosphate (TSP) or Single Superphosphate (SSP).
        severity:
          type: string
          enum: [none, Mild, Moderate, Severe]
          description: >
            `none` means the AI found nothing wrong (a healthy plant). Mild,
            Moderate and Severe lower the plant's health score.
        treated:
          type: boolean
          description: Set by `POST /diagnoses/{id}/treated`. A treated scan no longer lowers plant health.
        treatedAt:
          type: string
          format: date-time
          nullable: true
        disclaimer:
          type: string
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          nullable: true
          enum: [gemini, groq, mock]
          description: Which AI backend produced this result.

    CreateDiagnosisRequest:
      type: object
      required: [imageBase64]
      properties:
        plantId:
          type: string
          nullable: true
        imageBase64:
          type: string
          description: Base64-encoded photo bytes.
        sessionId:
          type: string
          description: |
            Optional. A chat session id. When present, the scan is also
            recorded in that session as two turns: the user's photo (with
            `note`) and a short assistant summary of the result, localized by
            Accept-Language. The photo and Diagnosis are stored once; both
            turns just reference them via `diagnosisId`.
        note:
          type: string
          maxLength: 500
          description: |
            Optional caption. Passed to the vision model as a hint (never as
            instructions) and saved as the user's chat turn when `sessionId`
            is set.

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          example: msg_f60528ef9bcba482b621ab91
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          nullable: true
          enum: [gemini, groq, mock]
          description: Which AI backend produced this reply (assistant messages only).
        diagnosisId:
          type: string
          nullable: true
          description: |
            The saved scan this turn belongs to: the user turn that carried a
            photo, the assistant turn that summarised it, or a user turn sent
            with a scan as context.
        imageUrl:
          type: string
          nullable: true
          description: |
            `/api/v1/diagnoses/{diagnosisId}/image`, present when diagnosisId
            is. Needs the Bearer token, so clients must fetch it with their
            API client (a plain image widget cannot).

    ChatSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: The session's first user message, trimmed to 40 characters.
        lastMessageAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    SendChatRequest:
      type: object
      required: [sessionId, content]
      properties:
        sessionId:
          type: string
        content:
          type: string
        diagnosisId:
          type: string
          description: |
            Optional. One of the caller's own saved scans, attached as
            context: stored on the user turn and described to the model (the
            first time it is mentioned in the session). Another user's or an
            unknown id is rejected with 400.
