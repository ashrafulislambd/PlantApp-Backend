services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Set ONLY in production's .env (never commit a real value here) -
      # see Caddyfile's own header comment for why this must stay
      # environment-driven rather than hardcoded.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certs/ACME account state across container
      # recreation - without this, every redeploy would re-request a fresh
      # cert from Let's Encrypt, which is both slow and rate-limited.
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # No host port published - Caddy (above, same compose project now)
    # reverse-proxies to this container over the default network and
    # terminates TLS. See Caddyfile's `reverse_proxy api:8133`.
    expose:
      - "8133"
    env_file:
      - .env
    environment:
      PORT: 8133
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-plantpal}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      REMINDER_INTERVAL: ${REMINDER_INTERVAL:-1m}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8133/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional local Mongo, unused when MONGO_URI in .env points at an Atlas cluster.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:
  caddy_data:
  caddy_config: