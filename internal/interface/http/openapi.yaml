openapi: 3.0.3
info:
  title: MyPlantPal API
  description: >
    API for the MyPlantPal app: plant care roadmaps, AI Doctor diagnosis,
    homemade fertilizer recipes, and the AI chat assistant. Repositories are
    currently in-memory and reset on restart.


    Localization: send an `Accept-Language: bn` header to receive Bengali
    text for fertilizer recipes, diagnosis results, and plant care
    tips/fertilizer recommendations, where a translation exists. Any other
    value (or no header) returns English. This only affects
    server-generated/seeded text, not user-submitted content (e.g. a
    fertilizer a user adds themselves).
  version: "1.0.0"
servers:
  - url: /
tags:
  - name: Plants
  - name: Fertilizers
  - name: Diagnoses
  - name: Chat
  - name: Meta

paths:
  /health:
    get:
      tags: [Meta]
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /api/v1/health:
    get:
      tags: [Meta]
      summary: API v1 liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: v1

  /api/v1/plants:
    get:
      tags: [Plants]
      summary: List all registered plants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plant"
    post:
      tags: [Plants]
      summary: Register a plant and generate its care roadmap
      description: Backs the "Create My Roadmap" action on the Maintainance screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlantRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/plants/{id}:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      tags: [Plants]
      summary: Get a plant by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plant"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Plants]
      summary: Delete a plant
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/fertilizers:
    get:
      tags: [Fertilizers]
      summary: List/search fertilizer recipes
      description: Backs the "Find your homemade fertilizer" search bar.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name or category.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Fertilizer"
    post:
      tags: [Fertilizers]
      summary: Add a new fertilizer recipe
      description: Backs the "Add a new Fertilizer" button.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFertilizerRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fertilizer"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/fertilizers/{id}:
    parameters:
      - $ref: "#/components/parameters/FertilizerId"
    get:
      tags: [Fertilizers]
      summary: Get a fertilizer recipe by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fertilizer"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/diagnoses:
    get:
      tags: [Diagnoses]
      summary: List diagnosis log entries
      description: Backs the "Add to Log" history on the Diseases Detection screen.
      parameters:
        - name: plantId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Diagnosis"
    post:
      tags: [Diagnoses]
      summary: Submit a plant photo for AI diagnosis
      description: >
        Backs "Upload your Plant's Photo" / "Open Camera to take photo" on
        the Diseases Detection screen. Currently served by a mock provider
        that rotates through canned results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiagnosisRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Diagnosis"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/diagnoses/{id}:
    parameters:
      - $ref: "#/components/parameters/DiagnosisId"
    get:
      tags: [Diagnoses]
      summary: Get a diagnosis by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Diagnosis"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/messages:
    get:
      tags: [Chat]
      summary: List a chat session's message history
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Chat]
      summary: Send a message and get an assistant reply
      description: Backs the "AI Chat Box" composer. Returns both the user's stored message and the generated assistant reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  parameters:
    PlantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FertilizerId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DiagnosisId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "invalid input: name is required"

    CareRoadmap:
      type: object
      properties:
        wateringTimes:
          type: array
          items:
            type: string
          example: ["08:00", "18:00"]
        waterAmountMl:
          type: integer
          example: 200
        tips:
          type: string
        fertilizerRecommendation:
          type: string

    Plant:
      type: object
      properties:
        id:
          type: string
          example: pl_3f9a1c2b4e5d6f7a8b9c0d1e
        name:
          type: string
          example: Rose
        type:
          type: string
          example: Water based
        ageStage:
          type: string
          example: mature
        careRoadmap:
          $ref: "#/components/schemas/CareRoadmap"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Rose
        type:
          type: string
          example: Water based
        ageStage:
          type: string
          enum: [seed, seedling, mature, adult]
          example: mature

    Fertilizer:
      type: object
      properties:
        id:
          type: string
          example: fert_seed_nitrogen
        name:
          type: string
          example: Nitrogen (leaf growth)
        category:
          type: string
          example: Nitrogen
        instructions:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateFertilizerRequest:
      type: object
      required: [name, instructions]
      properties:
        name:
          type: string
        category:
          type: string
        instructions:
          type: string

    Diagnosis:
      type: object
      properties:
        id:
          type: string
          example: diag_2360faf5c84fc7fed73a6b5f
        plantId:
          type: string
          nullable: true
        issue:
          type: string
          example: Your plant is suffering from Phosphorus deficiency.
        cure:
          type: string
          example: Use Triple Superphosphate (TSP) or Single Superphosphate (SSP).
        disclaimer:
          type: string
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          nullable: true
          enum: [gemini, groq, mock]
          description: Which AI backend produced this result.

    CreateDiagnosisRequest:
      type: object
      required: [imageBase64]
      properties:
        plantId:
          type: string
          nullable: true
        imageBase64:
          type: string
          description: Base64-encoded photo bytes.

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          example: msg_f60528ef9bcba482b621ab91
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          nullable: true
          enum: [gemini, groq, mock]
          description: Which AI backend produced this reply (assistant messages only).

    SendChatRequest:
      type: object
      required: [sessionId, content]
      properties:
        sessionId:
          type: string
        content:
          type: string
